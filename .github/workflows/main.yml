name: Run AFK Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run Bot
        env:
          SERVER_IP: "SosticeMC.aternos.me"
          SERVER_PORT: "41807"
          SERVER_VERSION: "26.2"
          BOT_NAME: "Giginoilgoat"
        run: node index.js
